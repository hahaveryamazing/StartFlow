[package]
name = "startflow"
version = "3.1.0"
edition = "2021"
rust-version = "1.90"
description = "Windows 智能工作中心"

[lib]
name = "startflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1.9", features = ["serde"] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls-no-alpn"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
tokio = { version = "1", features = ["time", "rt", "sync", "macros"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi", "Win32_Networking_WinSock", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader", "Win32_Security_Cryptography", "Win32_Security_Credentials"] }

[dev-dependencies]
tempfile = "3"
chrono-tz = "0.10"
